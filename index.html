<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по C++ и железу ПК</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --card-bg: #334155;
            --opt-bg: #475569;
            --opt-hover: #64748b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --container-bg: #ffffff;
            --card-bg: #e2e8f0;
            --opt-bg: #cbd5e1;
            --opt-hover: #94a3b8;
            --text-color: #0f172a;
            --accent-color: #0284c7;
        }

        * { box-sizing: border-box; transition: background 0.2s, color 0.2s; }
        
        body {
            font-family: Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { margin: 0; color: var(--accent-color); font-size: 1.4em; }

        .theme-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .description {
            font-size: 0.95em;
            opacity: 0.85;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .q-card {
            background: var(--card-bg);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            border-left: 3px solid var(--accent-color);
        }

        .q-title { font-weight: bold; margin-bottom: 10px; }
        
        .options { display: flex; flex-direction: column; gap: 6px; }
        
        label {
            background: var(--opt-bg);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            display: block;
        }
        
        label:hover { background: var(--opt-hover); }
        input[type="radio"] { margin-right: 8px; }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .submit-btn:hover { opacity: 0.9; }

        #results {
            margin-top: 20px;
            text-align: center;
            display: none;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 6px;
        }

        .footer-signature {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85em;
            opacity: 0.6;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-controls">
        <h1>Тестирование: C++ и компьютер</h1>
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">Сменить тему</button>
    </div>
    <p class="description">Небольшой тест на знание основ языка C++ и устройства компьютера.</p>

    <form id="quizForm">
        <div id="questions-container"></div>
        <button type="button" class="submit-btn" onclick="calculateResult()">Проверить ответы</button>
    </form>

    <div id="results">
        <div style="font-size: 1.2em; font-weight: bold;" id="scoreText"></div>
        <p id="feedbackText" style="margin-top: 10px;"></p>
    </div>

    <div class="footer-signature">Made by neshdanchik</div>
</div>

<script>
    const questions = [
        // --- C++ (1-10) ---
        { q: "1. С помощью какой команды выводят текст на экран в C++?", opts: ["cin", "cout", "print", "scan"], a: 1 },
        { q: "2. Какой символ обязательно ставится в конце большинства команд в C++?", opts: [".", ",", ";", ":"], a: 2 },
        { q: "3. Как называется главная функция, с которой всегда начинается программа на C++?", opts: ["begin()", "start()", "main()", "run()"], a: 2 },
        { q: "4. Какой оператор используется для создания циклов (например, со счетчиком)?", opts: ["if", "for", "else", "switch"], a: 1 },
        { q: "5. Какой оператор используется для проверки условий («если... то...»)?", opts: ["for", "while", "if", "int"], a: 2 },
        { q: "6. Какой тип данных (`bool`) хранит в себе?", opts: ["Только целые числа", "Только текст", "Истинное (true) или ложное (false) значение", "Только дроби"], a: 2 },
        { q: "7. Какой знак используется для проверки равенства двух чисел в условиях?", opts: ["=", "==", "!=", "->"], a: 1 },
        { q: "8. Какой тип данных используется для хранения целых чисел?", opts: ["int", "string", "char", "bool"], a: 0 },
        { q: "9. С помощью какой команды пользователь вводит данные с клавиатуры?", opts: ["cout", "cin", "input", "read"], a: 1 },
        { q: "10. Какой символ используется для написания комментариев в одну строку?", opts: ["//", "/* */", "<!-- -->", "#"], a: 0 },

        // --- Железо и ПК (11-20) ---
        { q: "11. Что является главным «мозгом» компьютера, который всё считает?", opts: ["Видеокарта", "Процессор (CPU)", "Блок питания", "Жесткий диск"], a: 1 },
        { q: "12. Что происходит с оперативной памятью (RAM) при выключении компьютера?", opts: ["Все данные стираются", "Ничего не меняется", "Данные сохраняются навсегда", "Память увеличивается"], a: 0 },
        { q: "13. В чем измеряется скорость (тактовая частота) процессора?", opts: ["В гигабайтах", "В гигагерцах", "В ваттах", "В литрах"], a: 1 },
        { q: "14. Какой диск работает быстрее всего?", opts: ["Обычный HDD", "SSD накопитель", "Дискета", "CD-диск"], a: 1 },
        { q: "15. Какая деталь отвечает за красивую графику в играх?", opts: ["Видеокарта", "Звуковая карта", "Кулер", "Оперативная память"], a: 0 },
        { q: "16. Где находится самая первая программа, которая запускает ПК при включении?", opts: ["В папке с Windows", "В BIOS / UEFI", "На рабочем столе", "В браузере"], a: 1 },
        { q: "17. Какая комбинация клавиш обычно закрывает активное окно?", opts: ["Ctrl + C", "Alt + F4", "Ctrl + V", "Win + D"], a: 1 },
        { q: "18. Какая файловая система используется в современных Windows?", opts: ["NTFS", "FAT16", "DOS", "Linux"], a: 0 },
        { q: "19. Сколько мегабайт в одном гигабайте (примерно, в компьютерном мире)?", opts: ["100", "1000", "1024", "2000"], a: 2 },
        { q: "20. На каком языке (на уровне «да/нет» и транзисторов) думает компьютер?", opts: ["Десятичный", "Двоичный (нули и единицы)", "Русский", "Английский"], a: 1 }
    ];

    const container = document.getElementById('questions-container');
    questions.forEach((item, index) => {
        let qDiv = document.createElement('div');
        qDiv.className = 'q-card';
        
        let optionsHtml = item.opts.map((opt, i) => `
            <label>
                <input type="radio" name="q${index}" value="${i}"> ${opt}
            </label>
        `).join('');

        qDiv.innerHTML = `<div class="q-title">${item.q}</div><div class="options">${optionsHtml}</div>`;
        container.appendChild(qDiv);
    });

    function toggleTheme() {
        const currentTheme = document.body.getAttribute('data-theme');
        const themeBtn = document.getElementById('themeBtn');
        if (currentTheme === 'light') {
            document.body.removeAttribute('data-theme');
            themeBtn.innerText = 'Сменить тему';
        } else {
            document.body.setAttribute('data-theme', 'light');
            themeBtn.innerText = 'Сменить тему';
        }
    }

    function calculateResult() {
        let score = 0;
        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected && parseInt(selected.value) === item.a) {
                score++;
            }
        });

        const resultsDiv = document.getElementById('results');
        const scoreText = document.getElementById('scoreText');
        const feedbackText = document.getElementById('feedbackText');

        scoreText.innerText = `Результат: ${score} из ${questions.length} (${Math.round((score / questions.length) * 100)}%)`;
        resultsDiv.style.display = 'block';

        if (score <= 8) {
            feedbackText.innerText = "Нужно еще немного повторить теорию.";
        } else if (score <= 15) {
            feedbackText.innerText = "Хороший результат! Основные темы усвоены.";
        } else {
            feedbackText.innerText = "Отличная работа! Всё сдано на высший балл.";
        }

        resultsDiv.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
