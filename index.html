<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по C++ и архитектуре ПК</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --card-bg: #334155;
            --opt-bg: #475569;
            --opt-hover: #64748b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --container-bg: #ffffff;
            --card-bg: #e2e8f0;
            --opt-bg: #cbd5e1;
            --opt-hover: #94a3b8;
            --text-color: #0f172a;
            --accent-color: #0284c7;
        }

        * { box-sizing: border-box; transition: background 0.2s, color 0.2s; }
        
        body {
            font-family: Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { margin: 0; color: var(--accent-color); font-size: 1.4em; }

        .theme-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .description {
            font-size: 0.95em;
            opacity: 0.85;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .q-card {
            background: var(--card-bg);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            border-left: 3px solid var(--accent-color);
        }

        .q-title { font-weight: bold; margin-bottom: 10px; }
        
        .options { display: flex; flex-direction: column; gap: 6px; }
        
        label {
            background: var(--opt-bg);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            display: block;
        }
        
        label:hover { background: var(--opt-hover); }
        input[type="radio"] { margin-right: 8px; }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .submit-btn:hover { opacity: 0.9; }

        #results {
            margin-top: 20px;
            text-align: center;
            display: none;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 6px;
        }

        .footer-signature {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85em;
            opacity: 0.6;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-controls">
        <h1>Тестирование: C++ и аппаратное обеспечение ПК</h1>
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">Сменить тему</button>
    </div>
    <p class="description">Пожалуйста, ответьте на представленные вопросы. Тест охватывает базовые принципы программирования на языке C++ и устройство компьютерного оборудования.</p>

    <form id="quizForm">
        <div id="questions-container"></div>
        <button type="button" class="submit-btn" onclick="calculateResult()">Проверить ответы</button>
    </form>

    <div id="results">
        <div style="font-size: 1.2em; font-weight: bold;" id="scoreText"></div>
        <p id="feedbackText" style="margin-top: 10px;"></p>
    </div>

    <div class="footer-signature">Made by neshdanchik</div>
</div>

<script>
    const questions = [
        // --- C++ (1-10) ---
        { q: "1. Какой оператор используется для вывода данных в поток в C++?", opts: ["cin >>", "cout <<", "printf()", "print()"], a: 1 },
        { q: "2. Что вернет выражение 11 % 3 в C++?", opts: ["3", "2", "3.66", "1"], a: 1 },
        { q: "3. Какой оператор возвращает адрес переменной?", opts: ["*", "&", "->", "%"], a: 1 },
        { q: "4. Какой заголовочный файл необходим для работы с std::cout?", opts: ["<math.h>", "<stdlib.h>", "<iostream>", "<string>"], a: 2 },
        { q: "5. Какой символ завершает большинство инструкций в C++?", opts: [":", ".", ";", ","], a: 2 },
        { q: "6. Какой тип данных используется для хранения одного символа?", opts: ["string", "char", "int", "bool"], a: 1 },
        { q: "7. Как называется функция, с которой начинается выполнение любой программы на C++?", opts: ["start()", "init()", "main()", "run()"], a: 2 },
        { q: "8. Какой оператор используется для сравнения «равно» в C++?", opts: ["=", "==", "===", "equals"], a: 1 },
        { q: "9. Логическое И (AND) в C++ обозначается символом:", opts: ["||", "&&", "and", "&="], a: 1 },
        { q: "10. Какой оператор используется для ввода данных из потока в C++?", opts: ["cin >>", "cout <<", "input()", "scanf()"], a: 0 },

        // --- Железо и ПК (11-20) ---
        { q: "11. Что называют центральным процессором (CPU) компьютера?", opts: ["Оперативная память", "Центральный процессор", "Видеокарта", "Материнская плата"], a: 1 },
        { q: "12. Какое главное свойство характерно для оперативной памяти (RAM)?", opts: ["Энергонезависимость", "Энергозависимость (данные стираются при выключении)", "Медленная скорость доступа", "Неограниченный объем"], a: 1 },
        { q: "13. В каких единицах измеряется тактовая частота процессора?", opts: ["Гигабайты (ГБ)", "Гигагерцы (ГГц)", "Ватты (Вт)", "МГц/с"], a: 1 },
        { q: "14. Какой тип накопителя обеспечивает наибольшую скорость чтения и записи?", opts: ["HDD", "NVMe SSD", "CD-ROM", "Флешка USB 2.0"], a: 1 },
        { q: "15. Какое устройство отвечает за обработку и вывод графики на монитор?", opts: ["Звуковая карта", "Графический процессор (GPU)", "Блок питания", "Система охлаждения"], a: 1 },
        { q: "16. Где хранятся базовые инструкции для инициализации оборудования при включении ПК?", opts: ["В оперативной памяти", "В микросхеме BIOS / UEFI", "На жестком диске в системной папке", "В кеше процессора"], a: 1 },
        { q: "17. Какая комбинация клавиш обычно закрывает активное окно в ОС Windows?", opts: ["Ctrl + C", "Alt + F4", "Ctrl + Shift + Esc", "Win + L"], a: 1 },
        { q: "18. Какая файловая система является стандартной для современных версий ОС Windows?", opts: ["FAT32", "NTFS", "ext4", "MS-DOS"], a: 1 },
        { q: "19. Сколько байт содержится в одном Килобайте (КБ) в информатике?", opts: ["1000", "1024", "512", "2048"], a: 1 },
        { q: "20. Какая система счисления используется цифровыми устройствами на аппаратном уровне?", opts: ["Десятичная", "Восьмеричная", "Двоичная", "Шестнадцатеричная"], a: 2 }
    ];

    // Динамическая генерация вопросов на странице через цикл
    const container = document.getElementById('questions-container');
    questions.forEach((item, index) => {
        let qDiv = document.createElement('div');
        qDiv.className = 'q-card';
        
        let optionsHtml = item.opts.map((opt, i) => `
            <label>
                <input type="radio" name="q${index}" value="${i}"> ${opt}
            </label>
        `).join('');

        qDiv.innerHTML = `<div class="q-title">${item.q}</div><div class="options">${optionsHtml}</div>`;
        container.appendChild(qDiv);
    });

    // Функция переключения светлой и темной темы
    function toggleTheme() {
        const currentTheme = document.body.getAttribute('data-theme');
        const themeBtn = document.getElementById('themeBtn');
        if (currentTheme === 'light') {
            document.body.removeAttribute('data-theme');
            themeBtn.innerText = 'Сменить тему';
        } else {
            document.body.setAttribute('data-theme', 'light');
            themeBtn.innerText = 'Сменить тему';
        }
    }

    // Функция проверки результатов тестирования
    function calculateResult() {
        let score = 0;
        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected && parseInt(selected.value) === item.a) {
                score++;
            }
        });

        const resultsDiv = document.getElementById('results');
        const scoreText = document.getElementById('scoreText');
        const feedbackText = document.getElementById('feedbackText');

        scoreText.innerText = `Результат: ${score} из ${questions.length} (${Math.round((score / questions.length) * 100)}%)`;
        resultsDiv.style.display = 'block';

        if (score <= 8) {
            feedbackText.innerText = "Уровень знаний ниже среднего. Рекомендуется повторить теоретический материал.";
        } else if (score <= 15) {
            feedbackText.innerText = "Хороший результат. Базовые концепции усвоены уверенно.";
        } else {
            feedbackText.innerText = "Отличный результат! Продемонстрирован высокий уровень знаний.";
        }

        resultsDiv.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
