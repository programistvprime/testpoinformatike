<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый тест по C++ и железу (не судите строго)</title>
    <style>
        /* Написал стили сам (ну почти, подсмотрел на StackOverflow) */
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --card-bg: #334155;
            --opt-bg: #475569;
            --opt-hover: #64748b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --container-bg: #ffffff;
            --card-bg: #e2e8f0;
            --opt-bg: #cbd5e1;
            --opt-hover: #94a3b8;
            --text-color: #0f172a;
            --accent-color: #0284c7;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        
        body {
            font-family: 'Courier New', Courier, monospace; /* Чисто по-хакерски */
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 2px dashed var(--accent-color);
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { margin: 0; color: var(--accent-color); font-size: 1.5em; }

        .theme-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
        }

        .q-card {
            background: var(--card-bg);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
        }

        .q-title { font-weight: bold; margin-bottom: 10px; }
        
        .options { display: flex; flex-direction: column; gap: 6px; }
        
        label {
            background: var(--opt-bg);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: block;
        }
        
        label:hover { background: var(--opt-hover); transform: translateX(4px); }
        input[type="radio"] { margin-right: 8px; }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-family: inherit;
        }
        
        .submit-btn:hover { filter: brightness(1.1); }

        #results {
            margin-top: 20px;
            text-align: center;
            display: none;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 8px;
        }

        #results img {
            max-width: 200px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .score-text { font-size: 1.3em; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-controls">
        <h1>🚀 Тест: C++ & Железо ПК</h1>
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Тёмная</button>
    </div>
    <p style="font-size: 0.9em; opacity: 0.8;">Привет! Я тут попытался сделать тест на 20 вопросов. Если что-то сломается — я не виноват, это всё баги в матрице 🤡</p>

    <form id="quizForm">
        <div id="questions-container"></div>
        <button type="button" class="submit-btn" onclick="calculateResult()">Запустить компиляцию результатов (Проверить)</button>
    </form>

    <div id="results">
        <div class="score-text" id="scoreText"></div>
        <p id="feedbackText"></p>
        <img id="statusImg" src="" alt="Мем результата">
    </div>
</div>

<script>
    // Массив вопросов (ровно 20 штук: 10 про C++ и 10 про железо/ПК)
    const questions = [
        // --- C++ (1-10) ---
        { q: "1. Какой оператор используется для вывода данных в поток в C++?", opts: ["cin >>", "cout <<", "printf()", "print()"], a: 1 },
        { q: "2. Что вернет выражение 11 % 3 в C++?", opts: ["3", "2", "3.66", "1"], a: 1 },
        { q: "3. Какой оператор возвращает адрес переменной?", opts: ["*", "&", "->", "%"], a: 1 },
        { q: "4. Какой заголовочный файл необходим для работы с std::cout?", opts: ["<math.h>", "<stdlib.h>", "<iostream>", "<string>"], a: 2 },
        { q: "5. Какой символ завершает большинство инструкций в C++?", opts: [":", ".", ";", ","], a: 2 },
        { q: "6. Какой тип данных используется для хранения одного символа?", opts: ["string", "char", "int", "bool"], a: 1 },
        { q: "7. Как называется функция, с которой начинается выполнение любой программы на C++?", opts: ["start()", "init()", "main()", "run()"], a: 2 },
        { q: "8. Какой оператор используется для сравнения «равно» в C++?", opts: ["=", "==", "===", "equals"], a: 1 },
        { q: "9. Логическое И (AND) в C++ обозначается символом:", opts: ["||", "&&", "and", "&="], a: 1 },
        { q: "10. Какой оператор используется для ввода данных из потока в C++?", opts: ["cin >>", "cout <<", "input()", "scanf()"], a: 0 },

        // --- Железо и ПК (11-20) ---
        { q: "11. Что называют «мозгом» компьютера?", opts: ["Оперативная память", "Центральный процессор (CPU)", "Видеокарта", "Материнская плата"], a: 1 },
        { q: "12. Какое главное свойство у оперативной памяти (RAM)?", opts: ["Энергонезависимость", "Энергозависимость (всё стирается при выключении)", "Медленная скорость", "Неограниченный объем"], a: 1 },
        { q: "13. В чем измеряется тактовая частота процессора?", opts: ["Гигабайты (ГБ)", "Гигагерцы (ГГц)", "Ватты (Вт)", "Митры"], a: 1 },
        { q: "14. Какой накопитель обеспечивает наивысшую скорость чтения/записи?", opts: ["HDD", "NVMe SSD", "CD-ROM", "Флешка USB 2.0"], a: 1 },
        { q: "15. Какое устройство отвечает за вывод графики и картинки на монитор?", opts: ["Звуковая карта", "Видеокарта (GPU)", "Блок питания", "Кулер"], a: 1 },
        { q: "16. Где хранятся базовые настройки системы и первичный код запуска ПК (до загрузки ОС)?", opts: ["В оперативной памяти", "В BIOS / UEFI (на микросхеме ПЗУ)", "На жестком диске в папке Windows", "В процессоре"], a: 1 },
        { q: "17. Какая комбинация клавиш обычно закрывает активное окно в Windows?", opts: ["Ctrl + C", "Alt + F4", "Ctrl + Shift + Esc", "Win + L"], a: 1 },
        { q: "18. Какая файловая система является основной для современных версий Windows?", opts: ["FAT32", "NTFS", "ext4", "MS-DOS"], a: 1 },
        { q: "19. Сколько байт содержится в 1 Килобайте (КБ) в компьютерной информатике?", opts: ["1000", "1024", "512", "2048"], a: 1 },
        { q: "20. В какой системе счисления функционируют цифровые компьютеры на уровне транзисторов?", opts: ["Десятичная", "Восьмеричная", "Двоичная", "Шестнадцатеричная"], a: 2 }
    ];

    // Рендерим вопросы через цикл (я старался!)
    const container = document.getElementById('questions-container');
    questions.forEach((item, index) => {
        let qDiv = document.createElement('div');
        qDiv.className = 'q-card';
        
        let optionsHtml = item.opts.map((opt, i) => `
            <label>
                <input type="radio" name="q${index}" value="${i}"> ${opt}
            </label>
        `).join('');

        qDiv.innerHTML = `<div class="q-title">${item.q}</div><div class="options">${optionsHtml}</div>`;
        container.appendChild(qDiv);
    });

    // Функция смены темы (нагуглил с первого раза)
    function toggleTheme() {
        const currentTheme = document.body.getAttribute('data-theme');
        const themeBtn = document.getElementById('themeBtn');
        if (currentTheme === 'light') {
            document.body.removeAttribute('data-theme');
            themeBtn.innerText = '🌙 Тёмная';
        } else {
            document.body.setAttribute('data-theme', 'light');
            themeBtn.innerText = '☀️ Светлая';
        }
    }

    // Подсчет результатов (тут вроде без ошибок, но это не точно)
    function calculateResult() {
        let score = 0;
        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected && parseInt(selected.value) === item.a) {
                score++;
            }
        });

        const resultsDiv = document.getElementById('results');
        const scoreText = document.getElementById('scoreText');
        const feedbackText = document.getElementById('feedbackText');
        const statusImg = document.getElementById('statusImg');

        scoreText.innerText = `Результат: ${score} из ${questions.length} верно!`;
        resultsDiv.style.display = 'block';

        if (score <= 8) {
            feedbackText.innerText = "Блин, ну тут даже компилятор бы заплакал... Пойду почитаю доку по C++ 😭";
            statusImg.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNmNiaWFxa2hhM29xM3Y4eG5ycDFzeWRidWFscWl6eXF1NmFjcWVpNSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L95W4wv8nnb9K/giphy.gif";
        } else if (score <= 15) {
            feedbackText.innerText = "Норм! На троечку с плюсом накодил, жить будем! 😎";
            statusImg.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExODF4OWV4dXAzaHF5bmprZXZmdmI0MnV6OG84czQzdGJua3BuaW1reCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/d31w24psGYeekCXY/giphy.gif";
        } else {
            feedbackText.innerText = "Ого! Ты точно не робот из терминатора? Поздравляю, ты красавчик! 🔥";
            statusImg.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ZtNHR1ZHd3Ym9vZjljandkM3pkeWF3aTFycXZtdndrOGs2cXJvYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/13Hgw8hS2aiWZ2/giphy.gif";
        }

        resultsDiv.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
