<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по C++ и железу ПК</title>
    <style>
        /* Стили сам писал, честно! Ну, половину подсмотрел в туториалах на ютубе ) */
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --card-bg: #334155;
            --opt-bg: #475569;
            --opt-hover: #64748b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --container-bg: #ffffff;
            --card-bg: #e2e8f0;
            --opt-bg: #cbd5e1;
            --opt-hover: #94a3b8;
            --text-color: #0f172a;
            --accent-color: #0284c7;
        }

        * { box-sizing: border-box; transition: 0.2s; } /* вроде плавно работает */
        
        body {
            font-family: Arial, sans-serif; /* решил не ставить всякие шрифты с гугла, чтоб не тормозило */
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { margin: 0; color: var(--accent-color); font-size: 1.4em; }

        .theme-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .q-card {
            background: var(--card-bg);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .q-title { font-weight: bold; margin-bottom: 10px; }
        
        .options { display: flex; flex-direction: column; gap: 6px; }
        
        label {
            background: var(--opt-bg);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        label:hover { background: var(--opt-hover); }
        input[type="radio"] { margin-right: 8px; }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .submit-btn:hover { opacity: 0.9; }

        #results {
            margin-top: 20px;
            text-align: center;
            display: none;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 6px;
        }

        .footer-signature {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85em;
            opacity: 0.6;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-controls">
        <h1>Тест по C++ и железу ПК</h1>
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">Сменить тему</button>
    </div>
    <p style="opacity: 0.8; font-size: 0.9em;">Привет! Я тут учусь программировать и решил сделать тест на 20 вопросов. Если что-то зависнет, сильно не пинайте, я только учусь JS писать 😅</p>

    <form id="quizForm">
        <div id="questions-container"></div>
        <button type="button" class="submit-btn" onclick="calculateResult()">Проверить ответы</button>
    </form>

    <div id="results">
        <div style="font-size: 1.2em; font-weight: bold;" id="scoreText"></div>
        <p id="feedbackText" style="margin-top: 10px;"></p>
    </div>

    <div class="footer-signature">Made by neshdanchik</div>
</div>

<script>
    // Собрал вопросы сам, половину из учебника, половину из интернета
    const questions = [
        // --- C++ (1-10) ---
        { q: "1. Какой оператор используется для вывода данных в поток в C++?", opts: ["cin >>", "cout <<", "printf()", "print()"], a: 1 },
        { q: "2. Что вернет выражение 11 % 3 в C++?", opts: ["3", "2", "3.66", "1"], a: 1 },
        { q: "3. Какой оператор возвращает адрес переменной?", opts: ["*", "&", "->", "%"], a: 1 },
        { q: "4. Какой заголовочный файл необходим для работы с std::cout?", opts: ["<math.h>", "<stdlib.h>", "<iostream>", "<string>"], a: 2 },
        { q: "5. Какой символ завершает большинство инструкций в C++?", opts: [":", ".", ";", ","], a: 2 },
        { q: "6. Какой тип данных используется для хранения одного символа?", opts: ["string", "char", "int", "bool"], a: 1 },
        { q: "7. Как называется функция, с которой начинается выполнение любой программы на C++?", opts: ["start()", "init()", "main()", "run()"], a: 2 },
        { q: "8. Какой оператор используется для сравнения «равно» в C++?", opts: ["=", "==", "===", "equals"], a: 1 },
        { q: "9. Логическое И (AND) в C++ обозначается символом:", opts: ["||", "&&", "and", "&="], a: 1 },
        { q: "10. Какой оператор используется для ввода данных из потока в C++?", opts: ["cin >>", "cout <<", "input()", "scanf()"], a: 0 },

        // --- Железо и ПК (11-20) ---
        { q: "11. Что называют «мозгом» компьютера?", opts: ["Оперативная память", "Центральный процессор (CPU)", "Видеокарта", "Материнская плата"], a: 1 },
        { q: "12. Какое главное свойство у оперативной памяти (RAM)?", opts: ["Энергонезависимость", "Энергозависимость (всё стирается при выключении)", "Медленная скорость", "Неограниченный объем"], a: 1 },
        { q: "13. В чем измеряется тактовая частота процессора?", opts: ["Гигабайты (ГБ)", "Гигагерцы (ГГц)", "Ватты (Вт)", "Митры"], a: 1 },
        { q: "14. Какой накопитель обеспечивает наивысшую скорость чтения/записи?", opts: ["HDD", "NVMe SSD", "CD-ROM", "Флешка USB 2.0"], a: 1 },
        { q: "15. Какое устройство отвечает за вывод графики и картинки на монитор?", opts: ["Звуковая карта", "Видеокарта (GPU)", "Блок питания", "Кулер"], a: 1 },
        { q: "16. Где хранятся базовые настройки системы и первичный код запуска ПК?", opts: ["В оперативной памяти", "В BIOS / UEFI (на микросхеме ПЗУ)", "На жестком диске в папке Windows", "В процессоре"], a: 1 },
        { q: "17. Какая комбинация клавиш обычно закрывает активное окно в Windows?", opts: ["Ctrl + C", "Alt + F4", "Ctrl + Shift + Esc", "Win + L"], a: 1 },
        { q: "18. Какая файловая система является основной для современных версий Windows?", opts: ["FAT32", "NTFS", "ext4", "MS-DOS"], a: 1 },
        { q: "19. Сколько байт содержится в 1 Килобайте (КБ)?", opts: ["1000", "1024", "512", "2048"], a: 1 },
        { q: "20. В какой системе счисления функционируют цифровые компьютеры на уровне транзисторов?", opts: ["Десятичная", "Восьмеричная", "Двоичная", "Шестнадцатеричная"], a: 2 }
    ];

    // Ой, долго думал, как сделать так, чтобы вопросы сами на страницу выводились, и вот додумался до цикла через JS! Круто получилось.
    const container = document.getElementById('questions-container');
    questions.forEach((item, index) => {
        let qDiv = document.createElement('div');
        qDiv.className = 'q-card';
        
        let optionsHtml = item.opts.map((opt, i) => `
            <label>
                <input type="radio" name="q${index}" value="${i}"> ${opt}
            </label>
        `).join('');

        qDiv.innerHTML = `<div class="q-title">${item.q}</div><div class="options">${optionsHtml}</div>`;
        container.appendChild(qDiv);
    });

    // Функция смены темы (нашел на stackoverflow, вроде работает)
    function toggleTheme() {
        const currentTheme = document.body.getAttribute('data-theme');
        const themeBtn = document.getElementById('themeBtn');
        if (currentTheme === 'light') {
            document.body.removeAttribute('data-theme');
            themeBtn.innerText = 'Сменить тему';
        } else {
            document.body.setAttribute('data-theme', 'light');
            themeBtn.innerText = 'Сменить тему';
        }
    }

    // Проверка результатов (писал сам, с третьего раза заработало без ошибок в консоли!)
    function calculateResult() {
        let score = 0;
        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected && parseInt(selected.value) === item.a) {
                score++;
            }
        });

        const resultsDiv = document.getElementById('results');
        const scoreText = document.getElementById('scoreText');
        const feedbackText = document.getElementById('feedbackText');

        scoreText.innerText = `Твой результат: ${score} из ${questions.length}`;
        resultsDiv.style.display = 'block';

        if (score <= 8) {
            feedbackText.innerText = "Ну... бывает :) Главное, что попытался! Я сам половину этих вопросов с гуглом отвечал.";
        } else if (score <= 15) {
            feedbackText.innerText = "Вообще норм! Крепкий среднячок, я примерно так же ответил бы.";
        } else {
            feedbackText.innerText = "Ух ты, да ты хакер! Научи меня тоже так круто всё знать!";
        }

        resultsDiv.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
